# The checks that can run without the game. The game itself cannot be built here: that needs C generated from a
# player's own disc.
name: checks
on:
  push:
  pull_request:
permissions: { contents: read }
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }

      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }

      # The same check as the pre-commit hook, over every tracked file. .gitignore and the hook keep these out
      # locally, but not from `git commit --no-verify` or a pull request.
      - name: No game data, generated code or binaries
        run: python -I tools/check_files.py --tracked

      - name: Setup's toolkit pin matches the submodule
        run: |
          sub=$(git ls-tree HEAD third_party/xboxrecomp | awk '{print $3}')
          grep -q "toolkitPin = \"$sub\"" tools/setup.ps1 || { echo "::error file=tools/setup.ps1::\$toolkitPin is not the submodule's commit $sub"; exit 1; }

      # Every player's setup applies these to the pinned toolkit commit; a developer's tree already has them in.
      - name: Patches apply to the pinned toolkit
        working-directory: third_party/xboxrecomp
        run: |
          for p in decode-stream extvma-buffers gpu-backend; do
            git apply "../../patches/xboxrecomp-$p.patch"
            echo "applied $p"
          done

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem tools -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              Write-Host "::error file=tools/$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $bad = 1
            }
          }
          exit $bad

      - name: Python tools compile
        run: python -m compileall -q tools
